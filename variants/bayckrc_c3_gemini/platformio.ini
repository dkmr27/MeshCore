; BAYCKRC C3 900/2400 Dual Band 100mW Gemini RX
; ESP32-C3 + 2x LR1121, ELRS target "dualc3", layout "Generic C3 LR1121 True Diversity.json"
; Single radio for now: ELRS radio 1 is the primary, ELRS radio 2 is held deselected.
; GPIO18/19 (USB D-/D+) are used for ELRS radio 2 DIO1 and the RGB LED, so Serial is UART0 on GPIO20 (RX) / GPIO21 (TX).
; LR11X0_DIO3_TCXO_VOLTAGE is not set: the TCXO is externally powered, not from DIO3 of either LR1121
;   (both radios init with TCXO voltage 0, and the ELRS layout has no radio_tcxo).
[BayckRC_C3_Gemini]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/bayckrc_c3_gemini
  -D ESP32_CPU_FREQ=80
  -D PIN_BOARD_SDA=-1   ; no I2C, default C3 Wire pins (8/9) are ELRS radio 2 BUSY and the button
  -D PIN_BOARD_SCL=-1
  -D RADIO_CLASS=CustomLR1121
  -D WRAPPER_CLASS=CustomLR1121Wrapper
  -D LORA_TX_POWER=22               ; ELRS power_values [12,16,19,22] -> 10..100mW, sub-GHz on HP PA
  -D LR1121_FORCE_HP_PA             ; ELRS uses the HP PA for sub-GHz on this target (no radio_rfo_hf)
  -D LR1121_HF_MAX_TX_POWER=-2      ; ELRS power_values_dual [-12,-9,-6,-2] -> 10..100mW, external 2.4GHz PA
  -D LR1121_USE_DCDC                ; radio_dcdc: true
  -D RX_BOOSTED_GAIN=1
  -D P_LORA_SCLK=6
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=4
  ; primary = ELRS radio 1 (radio_*)
  -D P_LORA_NSS=0
  -D P_LORA_DIO_1=1
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=3
  ; secondary = ELRS radio 2 (radio_*_2), held deselected
  -D P_LORA2_NSS=7
  -D P_LORA2_DIO_1=18
  -D P_LORA2_RESET=10
  -D P_LORA2_BUSY=8
  ; led_rgb: 19 (WS2812, GRB) - not used yet
  ; button: 9 (BOOT) - not used yet
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/bayckrc_c3_gemini>
lib_deps =
  ${esp32_base.lib_deps}

[env:BayckRC_C3_Gemini_repeater]
extends = BayckRC_C3_Gemini
build_src_filter = ${BayckRC_C3_Gemini.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${BayckRC_C3_Gemini.build_flags}
  -D ADVERT_NAME='"Gemini Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${BayckRC_C3_Gemini.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

; Dual radio crossband repeater: radio 1 is the normal mesh radio (stored prefs),
; radio 2 is a LoRa bridge with fixed settings. RX on either radio, TX on both.
[env:BayckRC_C3_Gemini_dual_repeater]
extends = BayckRC_C3_Gemini
build_src_filter = ${BayckRC_C3_Gemini.build_src_filter}
  +<helpers/bridges/LoRaBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${BayckRC_C3_Gemini.build_flags}
  -D ADVERT_NAME='"Gemini Dual Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_LORA_BRIDGE=radio2
  -D LORA2_FREQ=2483.0
  -D LORA2_BW=406.25
  -D LORA2_SF=11
  -D LORA2_CR=5
  -D LORA2_TX_POWER=-2              ; max for this board, see LR1121_HF_MAX_TX_POWER
;  -D BRIDGE_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${BayckRC_C3_Gemini.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:BayckRC_C3_Gemini_room_server]
extends = BayckRC_C3_Gemini
build_src_filter = ${BayckRC_C3_Gemini.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
build_flags =
  ${BayckRC_C3_Gemini.build_flags}
  -D ADVERT_NAME='"Gemini Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${BayckRC_C3_Gemini.lib_deps}
  ${esp32_ota.lib_deps}

[env:BayckRC_C3_Gemini_companion_radio_usb]
extends = BayckRC_C3_Gemini
build_src_filter = ${BayckRC_C3_Gemini.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/*.cpp>
build_flags =
  ${BayckRC_C3_Gemini.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE           ; serial companion over UART0 (GPIO20/21)
  ; -D MESH_PACKET_LOGGING=1
  ; -D MESH_DEBUG=1
lib_deps =
  ${BayckRC_C3_Gemini.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:BayckRC_C3_Gemini_companion_radio_ble]
extends = BayckRC_C3_Gemini
board_build.partitions = min_spiffs.csv ; get around 4mb flash limit
build_src_filter = ${BayckRC_C3_Gemini.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/*.cpp>
build_flags =
  ${BayckRC_C3_Gemini.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  ; -D BLE_DEBUG_LOGGING=1
  ; -D MESH_PACKET_LOGGING=1
  ; -D MESH_DEBUG=1
lib_deps =
  ${BayckRC_C3_Gemini.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
