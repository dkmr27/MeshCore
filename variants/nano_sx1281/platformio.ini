[Nano_SX1281]
extends = esp8266_base
board = esp8285
build_flags =
  ${esp8266_base.build_flags}
  -I variants/nano_sx1281
  ;-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
  -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
  -D MAX_CLIENTS=2
  -D LORA_TX_POWER=0           ; testing values only
  -D MAX_LORA_TX_POWER=0       ; testing values only
  -D P_LORA_TX_LED=16
  -D P_LORA_NSS=15
  -D P_LORA_SCLK=14
  -D P_LORA_MISO=12  ; button 0 "serial_rx": 3,  "serial_tx": 1,
  -D P_LORA_MOSI=13
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=5
  -D P_LORA_DIO_1=4
  -D SX128X_RXEN=9            ; FEM RX enable
  -D SX128X_TXEN=10           ; FEM TX enable
  -D LORA_FREQ=2483
  -D LORA_BW=406.25
  -D LORA_SF=11
  -D USE_SX1280
  -D RADIO_CLASS=CustomSX1280
  -D WRAPPER_CLASS=CustomSX1280Wrapper
build_src_filter = ${esp8266_base.build_src_filter}
  +<../variants/nano_sx1281>

[env:Nano_SX1281_repeater]
extends = Nano_SX1281
build_src_filter = ${Nano_SX1281.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${Nano_SX1281.build_flags}
  -D ADVERT_NAME='"Nano SX1281 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=5
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${Nano_SX1281.lib_deps}



[env:Nano_SX1281_kiss_modem]
extends = Nano_SX1281
build_src_filter = ${Nano_SX1281.build_src_filter}
  +<../examples/kiss_modem/>
build_flags =
  ${Nano_SX1281.build_flags}
