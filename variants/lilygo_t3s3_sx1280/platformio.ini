[env:LilyGo_T3S3_sx1280_terminal_chat]
extends = LilyGo_T3S3_sx1280
build_flags =
  ${LilyGo_T3S3_sx1280.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_T3S3_sx1280.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${LilyGo_T3S3_sx1280.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_T3S3_sx1280_room_server]
extends = LilyGo_T3S3_sx1280
build_flags =
  ${LilyGo_T3S3_sx1280.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"T3S3-1280 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_T3S3_sx1280.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${LilyGo_T3S3_sx1280.lib_deps}
  ${esp32_ota.lib_deps}

[env:LilyGo_T3S3_sx1280_companion_radio_usb]
extends = LilyGo_T3S3_sx1280
build_flags =
  ${LilyGo_T3S3_sx1280.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_T3S3_sx1280.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_T3S3_sx1280.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_T3S3_sx1280_companion_radio_ble]
extends = LilyGo_T3S3_sx1280
build_flags =
  ${LilyGo_T3S3_sx1280.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_T3S3_sx1280.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_T3S3_sx1280.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_T3S3_sx1280_kiss_modem]
extends = LilyGo_T3S3_sx1280
build_src_filter = ${LilyGo_T3S3_sx1280.build_src_filter}
  +<../examples/kiss_modem/>

