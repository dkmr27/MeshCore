[LilyGo_T3S3_sx1280]
extends = esp32_base
board = t3_s3_v1_x
build_flags =
  ${esp32_base.build_flags}
  -I variants/lilygo_t3s3_sx1280
  -D LILYGO_T3S3_SX1280
  -D PIN_VBAT_READ=1
  -D PIN_USER_BTN=0
  -D PIN_BOARD_SDA=18
  -D PIN_BOARD_SCL=17
  -D P_LORA_NSS=7
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=3
  -D P_LORA_MOSI=6
  -D P_LORA_RESET=8
  -D P_LORA_BUSY=36
  -D P_LORA_DIO_1=9
  -D SX128X_RXEN=21
  -D SX128X_TXEN=10
  -D USE_SX1280
  -D LORA_FREQ=2483.0
  -D LORA_BW=406.25
  -D LORA_SF=11
  -D LORA_CR=5
  -D RADIO_CLASS=CustomSX1280
  -D WRAPPER_CLASS=CustomSX1280Wrapper
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_t3s3_sx1280>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[LilyGo_T3S3_sx1280_PA]
extends = LilyGo_T3S3_sx1280
build_flags =
  ${LilyGo_T3S3_sx1280.build_flags}
  -D LORA_TX_POWER=3           ; default to 3 is 20dbm output
  -D MAX_LORA_TX_POWER=5       ; no more or PA may die

; === LilyGo T3S3 with SX1280 environments ===
[env:LilyGo_T3S3_sx1280_repeater]
extends = LilyGo_T3S3_sx1280
build_flags =
  ${LilyGo_T3S3_sx1280.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"T3S3-1280 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_T3S3_sx1280.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${LilyGo_T3S3_sx1280.lib_deps}
  ${esp32_ota.lib_deps}

