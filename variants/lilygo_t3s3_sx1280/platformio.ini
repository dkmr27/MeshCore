; =====================================================================================
;  LilyGo T3-S3 with SX1280 (2.4 GHz LoRa)
;
;  Same board (t3_s3_v1_x) and 0.96" SSD1306 OLED as the LR1121 T3S3 variant; the radio
;  is the SX1280 with an EXTERNAL RF switch (RXEN=GPIO21 / TXEN=GPIO10). Interoperates
;  with the LR1121 2.4 GHz mesh (cross-chip SX1280<->LR1121 confirmed on hardware).
;  Default plan: 2450.0 MHz / 812.5 kHz / SF10 / CR4-5 / preamble 12 / sync 0x12.
;
;  NOTE: GPIO21 is the SX1280 RXEN here, so the OLED runs with PIN_OLED_RESET=-1 (no
;  reset toggle; it inits over I2C fine) -- do NOT set the OLED reset to 21 on this board.
;
;  Environments (4): companion_radio_ble / _usb / repeater / room_server (all drive OLED)
; =====================================================================================

; ---- shared hardware (pins / radio class), band-independent ----
[sx1280_t3s3_hw]
build_flags =
  -I variants/lilygo_t3s3_sx1280
  -D LILYGO_T3S3_SX1280
  -D PIN_VBAT_READ=1
  -D PIN_USER_BTN=0
  -D PIN_BOARD_SDA=18
  -D PIN_BOARD_SCL=17
  ; --- SX1280 pin wiring (T3-S3) ---
  -D P_LORA_NSS=7
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=3
  -D P_LORA_MOSI=6
  -D P_LORA_RESET=8
  -D P_LORA_BUSY=36
  -D P_LORA_DIO_1=9            ; radio IRQ
  -D SX128X_RXEN=21            ; external RF-switch RX enable
  -D SX128X_TXEN=10            ; external RF-switch TX enable
  -D USE_SX1280
  -D RADIO_CLASS=CustomSX1280
  -D WRAPPER_CLASS=CustomSX1280Wrapper

[LilyGo_T3S3_sx1280]
extends = esp32_base
board = t3_s3_v1_x
; un-exclude the SX128x driver (esp32_base excludes it); build_unflags is reliable.
build_unflags = -D RADIOLIB_EXCLUDE_SX128X=1
build_flags =
  ${esp32_base.build_flags}
  ${sx1280_t3s3_hw.build_flags}
  -D LORA_TX_POWER=3           ; default to 3 is 20dbm output
  -D MAX_LORA_TX_POWER=5       ; no more or PA may die
  ; --- default 2.4 GHz frequency plan ---
  -D LORA_FREQ=2483.0
  -D LORA_BW=406.25
  -D LORA_SF=11
  -D LORA_CR=5
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_t3s3_sx1280>
lib_deps =
  ${esp32_base.lib_deps}

; =====================================================================================
;  Environments
; =====================================================================================

[env:LilyGo_T3S3_sx1280_companion_radio_ble]
extends = LilyGo_T3S3_sx1280
build_flags =
  ${LilyGo_T3S3_sx1280.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
  ; --- on-board 0.96" SSD1306 OLED (RST=-1: GPIO21 is the SX1280 RXEN on this board) ---
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=-1
build_src_filter = ${LilyGo_T3S3_sx1280.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${LilyGo_T3S3_sx1280.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:LilyGo_T3S3_sx1280_companion_radio_usb]
extends = LilyGo_T3S3_sx1280
build_flags =
  ${LilyGo_T3S3_sx1280.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  ; --- on-board 0.96" SSD1306 OLED (status; USB transport, no BLE pin) ---
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=-1
build_src_filter = ${LilyGo_T3S3_sx1280.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/SSD1306Display.cpp>
lib_deps =
  ${LilyGo_T3S3_sx1280.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:LilyGo_T3S3_sx1280_repeater]
extends = LilyGo_T3S3_sx1280
build_flags =
  ${LilyGo_T3S3_sx1280.build_flags}
  -D ADVERT_NAME='"T3S3 SX1280 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=-1
build_src_filter = ${LilyGo_T3S3_sx1280.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/SSD1306Display.cpp>
lib_deps =
  ${LilyGo_T3S3_sx1280.lib_deps}
  ${esp32_ota.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:LilyGo_T3S3_sx1280_room_server]
extends = LilyGo_T3S3_sx1280
build_flags =
  ${LilyGo_T3S3_sx1280.build_flags}
  -D ADVERT_NAME='"T3S3 SX1280 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=-1
build_src_filter = ${LilyGo_T3S3_sx1280.build_src_filter}
  +<../examples/simple_room_server>
  +<helpers/ui/SSD1306Display.cpp>
lib_deps =
  ${LilyGo_T3S3_sx1280.lib_deps}
  ${esp32_ota.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
